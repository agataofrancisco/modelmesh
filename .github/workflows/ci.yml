name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      MODELMESH_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]" || pip install pytest==9.2.0 pytest-asyncio==1.5.0 "fakeredis[lua]==2.40.0" lupa==2.8 pgserver==0.1.4 openai==3.57.0 ruff==0.17.6
      - name: Lint
        run: |
          ruff check gateway tests chaos bench
          ruff format --check gateway tests chaos bench
      - name: Testes (inclui Redis real via serviço e PostgreSQL via pgserver)
        run: pytest -q
      - name: Chaos (8 cenários com asserções)
        run: python -m chaos.run_chaos

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
