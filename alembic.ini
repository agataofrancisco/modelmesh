[alembic]
script_location = migrations
prepend_sys_path = .
# A URL real vem de MODELMESH_DATABASE_URL (migrations/env.py); este valor é só um fallback local.
sqlalchemy.url = sqlite:///./.runtime/modelmesh.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
